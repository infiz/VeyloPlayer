<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9ff"/>
      <stop offset="1" stop-color="#e5edff"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6478f4" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5268ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#35406d" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="660" height="400" rx="18" fill="url(#background)"/>
  <circle cx="60" cy="30" r="150" fill="#ffffff" opacity="0.32"/>
  <circle cx="620" cy="350" r="190" fill="#bdcbff" opacity="0.2"/>

  <text x="330" y="61" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, sans-serif"
        font-size="28" font-weight="650" fill="#1d2543">Install VeyloPlayer</text>
  <text x="330" y="90" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, sans-serif"
        font-size="14" fill="#626b89">Drag VeyloPlayer into Applications</text>

  <g filter="url(#shadow)">
    <rect x="270" y="184" width="105" height="14" rx="7" fill="url(#arrow)"/>
    <path d="M364 163 L410 191 L364 219 Z" fill="#5268ee"/>
  </g>

  <text x="330" y="339" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Helvetica Neue, sans-serif"
        font-size="13" fill="#737c98">Then open VeyloPlayer from your Applications folder</text>
</svg>
